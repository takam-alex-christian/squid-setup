# Require a username and password for every proxy request.
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm Squid proxy-caching web server
auth_param basic credentialsttl 2 hours

acl authenticated proxy_auth REQUIRED

http_access allow authenticated
http_access deny all

http_port 3128

# The destination should see the VPS public IP as the network source. Do not
# forward the original client's IP or identify this server as a proxy.
forwarded_for delete
via off

# Remove client/proxy identity headers from plain HTTP requests. HTTPS CONNECT
# traffic is tunneled, so the destination still sees the VPS IP at the network
# layer while the client's encrypted application headers remain untouched.
request_header_access X-Forwarded-For deny all
request_header_access X-Forwarded-Proto deny all
request_header_access X-Forwarded-By deny all
request_header_access X-Real-IP deny all
request_header_access Client-IP deny all
request_header_access Forwarded deny all
request_header_access From deny all
request_header_access Proxy-Authorization deny all

cache deny all
